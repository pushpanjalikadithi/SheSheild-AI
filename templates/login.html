<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SheShield AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #16001f, #42005c, #71008c);
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            padding: 40px;
            border-radius: 25px;
            background: rgba(255,255,255,0.09);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 55px;
        }

        h1 {
            text-align: center;
            margin: 10px 0;
        }

        .subtitle {
            text-align: center;
            color: #d8c5df;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.25);
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #ff6ee8;
        }

        input::placeholder {
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #ff45d3, #a855f7);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .error {
            background: rgba(255,0,0,0.2);
            border: 1px solid rgba(255,100,100,0.4);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .bottom {
            text-align: center;
            margin-top: 25px;
            color: #ddd;
        }

        .bottom a {
            color: #ff91ec;
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ccc;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">🛡️</div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your SheShield AI account
        </p>

        {% if error %}
            <div class="error">
                ⚠️ {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="/login">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                🔐 Login Securely
            </button>

        </form>

        <div class="bottom">
            Don't have an account?
            <a href="/register">Create Account</a>
        </div>

        <a href="/" class="home">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
